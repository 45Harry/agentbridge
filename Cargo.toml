[package]
name = "agentbridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first CLI + MCP server that bridges session context across AI coding agents."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
