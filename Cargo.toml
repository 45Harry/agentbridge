[package]
name = "agentbridge"
version = "0.4.0"
edition = "2024"
# `File::try_lock` (the run lock) needs 1.89.
rust-version = "1.89"
license = "MIT"
description = "Local-first CLI + MCP server that bridges session context across AI coding agents."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4", "v5"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
regex = "1"

[dev-dependencies]
tempfile = "3"
fastrand = "2"
