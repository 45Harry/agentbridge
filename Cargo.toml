[package]
name = "agentbridge"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "Local-first CLI + MCP server that bridges session context across AI coding agents."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4", "v5"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
